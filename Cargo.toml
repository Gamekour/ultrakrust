[workspace]
resolver = "3"
members = ["crates/uk-core", "crates/uk-assets", "crates/ultrakrust"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
bevy = "0.19.1"
bevy_math = { version = "0.19.1", default-features = false, features = ["std"] }

# Fast debug iteration while keeping physics math optimized.
[profile.dev.package."*"]
opt-level = 3
[profile.dev]
opt-level = 1
